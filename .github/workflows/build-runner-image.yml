name: Build ARC runner image

# Builds the custom self-hosted runner image and pushes it to GHCR.
#
# Runs on the org's ARC pool like every other job — there are no GitHub-hosted runners
# left in this org, public repos included. Uses GITHUB_TOKEN only — no PAT.
#
# Bootstrap caveat: this workflow builds the very image the ARC pool runs on, so a bad
# push to :latest can leave it unable to rebuild itself. The recovery path is the local
# `docker buildx` in README.md "Local build (fallback, no Actions)", plus the immutable
# snapshot-YYYYMMDD-<sha> tag this build stamps for rollback.

on:
  schedule:
    - cron: '0 2 * * *'    # 02:00 UTC nightly — picks up upstream :latest base
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - Dockerfile.runner
      - .github/workflows/build-runner-image.yml

permissions:
  contents: read
  packages: write          # lets GITHUB_TOKEN push to ghcr.io/<org>/... (overrides the read-only default)

env:
  IMAGE: ghcr.io/automationnexus/arcrunner
  # Runners pull :latest (auto-update on every push). Base is FROM ...:latest, so a rebuild
  # is not reproducible — each build also gets an immutable dated snapshot tag (computed below)
  # kept for rollback (snapshot-YYYYMMDD-<shortsha>).

jobs:
  build:
    runs-on: ["linux", "x64", "k3s", "ubuntu-latest"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute snapshot tag
        id: snap
        run: echo "tag=snapshot-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.snap.outputs.tag }}
