name: Build ARC runner image

# Builds the custom self-hosted runner image and pushes it to GHCR.
#
# Runs on GitHub-hosted ubuntu-latest — this repo moved out of the AutomationNexus org,
# so it no longer has access to that org's private ARC pool, and building the pool's own
# image on GitHub-hosted infra avoids the bootstrap risk of a self-hosted build breaking
# its own runners. Uses GITHUB_TOKEN only — no PAT.
#
# The immutable snapshot-YYYYMMDD-<sha> tag this build stamps is kept for rollback if a
# bad :latest ever needs reverting on the consuming clusters.

on:
  schedule:
    - cron: '0 2 * * *'    # 02:00 UTC nightly — picks up upstream :latest base
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - Dockerfile.runner
      - .github/workflows/build-runner-image.yml

permissions:
  contents: read
  packages: write          # lets GITHUB_TOKEN push to ghcr.io/<org>/... (overrides the read-only default)

env:
  IMAGE: ghcr.io/ghostkernel-core/arcrunner
  # Runners pull :latest (auto-update on every push). Base is FROM ...:latest, so a rebuild
  # is not reproducible — each build also gets an immutable dated snapshot tag (computed below)
  # kept for rollback (snapshot-YYYYMMDD-<shortsha>).

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute snapshot tag
        id: snap
        run: echo "tag=snapshot-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.snap.outputs.tag }}
